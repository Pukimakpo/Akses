<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sayfraial Stresser</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin: 50px auto;
      max-width: 400px;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 8px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background: #444;
    }
    .admin-panel {
      display: none;
      margin-top: 20px;
    }
    .section {
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login Sayfraial</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <div id="adminPanel" class="admin-panel">
      <h3>Admin Panel</h3>
      <div class="section">
        <h4>Add User</h4>
        <input type="text" id="newUsername" placeholder="Username">
        <input type="text" id="newPassword" placeholder="Password">
        <input type="number" id="newConc" placeholder="Concurrency">
        <input type="number" id="newTime" placeholder="Time Limit">
        <input type="date" id="newExpiry">
        <button onclick="addUser()">Add User</button>
      </div>
      <div class="section">
        <h4>User List</h4>
        <ul id="userList"></ul>
      </div>
    </div>
  </div>

  <script>
    let currentUser;

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const res = await fetch("http://178.128.110.4:8080/api/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        if (currentUser.role === "admin") {
          document.getElementById("adminPanel").style.display = "block";
          loadUsers();
        } else {
          alert("Login berhasil sebagai user.");
        }
      } else {
        alert("Login gagal: " + data.message);
      }
    });

    async function loadUsers() {
      const res = await fetch("http://178.128.110.4:8080/api/users");
      const users = await res.json();
      const list = document.getElementById("userList");
      list.innerHTML = "";
      users.forEach(user => {
        const li = document.createElement("li");
        li.textContent = `${user.username} | conc: ${user.conc} | expiry: ${user.expiry}`;
        const btn = document.createElement("button");
        btn.textContent = "Delete";
        btn.onclick = async () => {
          await fetch(`http://178.128.110.4:8080/api/users/${user.username}`, { method: "DELETE" });
          loadUsers();
        };
        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    async function addUser() {
      const username = document.getElementById("newUsername").value;
      const password = document.getElementById("newPassword").value;
      const conc = parseInt(document.getElementById("newConc").value);
      const time_limit = parseInt(document.getElementById("newTime").value);
      const expiry = document.getElementById("newExpiry").value;

      const res = await fetch("http://178.128.110.4:8080/api/users", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, password, conc, time_limit, expiry })
      });
      const data = await res.json();
      if (data.success) {
        alert("User added.");
        loadUsers();
      } else {
        alert("Failed: " + data.message);
      }
    }
  </script>
</body>
</html>
