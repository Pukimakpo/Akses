<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sayfraial Stresser</title>
  <style>
    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header, main {
      padding: 20px;
    }
    .container { max-width: 800px; margin: auto; }
    .hidden { display: none; }
    input, button, select {
      margin: 5px 0;
      padding: 8px;
      width: 100%;
      border: none;
      border-radius: 4px;
    }
    button { background: #444; color: #fff; cursor: pointer; }
    button:hover { background: #666; }
    .admin-panel, .attack-panel, .dashboard, .login-panel { margin-top: 20px; }
    h2 { border-bottom: 1px solid #444; padding-bottom: 5px; }
    .flex { display: flex; gap: 20px; }
    .half { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sayfraial Stresser</h1>
      <p>Owner: Syafrial</p>
    </header>

    <main>
      <!-- LOGIN -->
      <section class="login-panel">
        <h2>Login</h2>
        <input id="username" placeholder="Username" />
        <input id="password" type="password" placeholder="Password" />
        <button onclick="login()">Login</button>
        <p id="login-status"></p>
      </section>

      <!-- DASHBOARD -->
      <section class="dashboard hidden">
        <h2>Dashboard</h2>
        <p id="welcome-msg"></p>
        <p><b>Attack Today:</b> 0 | <b>Month:</b> 0</p>
        <p><b>Expires:</b> <span id="expiry"></span></p>
      </section>

      <!-- ATTACK -->
      <section class="attack-panel hidden">
        <h2>Attack Panel</h2>
        <input placeholder="Target URL/IP" />
        <input placeholder="Time (seconds)" />
        <input placeholder="Concurrent (CONC)" />
        <select>
          <option>L7</option>
          <option>L4</option>
        </select>
        <button>Launch Attack</button>
      </section>

      <!-- ADMIN -->
      <section class="admin-panel hidden">
        <h2>Admin: Manage Users</h2>
        <div class="flex">
          <div class="half">
            <h3>Add User</h3>
            <input id="new-username" placeholder="Username" />
            <input id="new-password" placeholder="Password" />
            <input id="new-conc" placeholder="CONC" />
            <input id="new-tl" placeholder="Time Limit" />
            <input id="new-expiry" type="date" />
            <button onclick="addUser()">Add</button>
          </div>
          <div class="half">
            <h3>Delete User</h3>
            <input id="del-username" placeholder="Username" />
            <button onclick="deleteUser()">Delete</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API = "https://hospitable-bravery-production.up.railway.app/"; // ganti jika deploy lain

    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      fetch(`${API}/api/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      })
        .then((res) => {
          if (!res.ok) throw new Error("Login gagal");
          return res.json();
        })
        .then((data) => {
          document.querySelector(".login-panel").classList.add("hidden");
          document.querySelector(".dashboard").classList.remove("hidden");
          document.querySelector(".attack-panel").classList.remove("hidden");
          document.getElementById("welcome-msg").textContent = `Welcome, ${data.username}`;
          document.getElementById("expiry").textContent = data.expiry;

          if (data.isAdmin) {
            document.querySelector(".admin-panel").classList.remove("hidden");
          }
        })
        .catch((err) => {
          document.getElementById("login-status").textContent = "Login gagal";
        });
    }

    function addUser() {
      const body = {
        username: document.getElementById("new-username").value,
        password: document.getElementById("new-password").value,
        conc: Number(document.getElementById("new-conc").value),
        timeLimit: Number(document.getElementById("new-tl").value),
        expiry: new Date(document.getElementById("new-expiry").value).toISOString(),
        isAdmin: false
      };
      fetch(`${API}/api/add-user`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }).then(() => alert("User added!"));
    }

    function deleteUser() {
      const username = document.getElementById("del-username").value;
      fetch(`${API}/api/delete-user`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
      }).then(() => alert("User deleted!"));
    }
  </script>
</body>
</html>
