<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stresser Panel</title>
  <style>
    body {
      background-color: #121212;
      color: #eee;
      font-family: sans-serif;
      margin: 0;
    }
    header {
      background: #1f1f1f;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    main {
      padding: 20px;
    }
    button {
      background: #444;
      color: white;
      border: none;
      padding: 8px 14px;
      margin: 3px;
      cursor: pointer;
      border-radius: 5px;
    }
    input, select {
      padding: 8px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #444;
      background: #222;
      color: white;
      width: 100%;
    }
    .hidden {
      display: none;
    }
    .card {
      background: #1f1f1f;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .admin-only {
      display: none;
    }
    #signup-btn {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      background: #333;
    }
  </style>
</head>
<body>

  <!-- Navbar, disembunyikan sampai login -->
  <header id="nav" class="hidden">
    <h2>Stresser Panel</h2>
    <div>
      <button onclick="showPage('dashboard')">Dashboard</button>
      <button onclick="showPage('attack')">Attack</button>
      <button onclick="showPage('history')">History</button>
      <button onclick="showPage('owner')">Owner</button>
      <button class="admin-only" onclick="showPage('admin')">Admin</button>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <!-- LOGIN PAGE -->
    <div id="login">
      <h3>Login</h3>
      <input type="text" id="login-username" placeholder="Username" />
      <input type="password" id="login-password" placeholder="Password" />
      <button onclick="login()">Login</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
      <div class="card">
        <h3>Selamat datang!</h3>
        <p>Ini adalah panel stresser yang dibuat oleh <b>Syafrial</b>.</p>
        <p><b>Status:</b> <span id="status"></span></p>
        <p><b>Expiry:</b> <span id="expiry"></span></p>
      </div>
    </div>

    <!-- ATTACK -->
    <div id="attack" class="hidden">
      <div class="card">
        <h3>Attack Panel</h3>
        <select id="method">
          <option value="L4">L4</option>
          <option value="L7">L7</option>
        </select>
        <input type="text" id="target" placeholder="Target URL/IP" />
        <input type="number" id="duration" placeholder="Durasi (detik)" />
        <button onclick="sendAttack()">Send Attack</button>
      </div>
    </div>

    <!-- HISTORY -->
    <div id="history" class="hidden">
      <div class="card">
        <h3>Riwayat Serangan</h3>
        <ul id="history-list"></ul>
      </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin" class="hidden">
      <div class="card">
        <h3>Admin Panel - Tambah User</h3>
        <input id="new-username" placeholder="Username" />
        <input id="new-password" placeholder="Password" />
        <input id="new-conc" type="number" placeholder="Concurrent" />
        <input id="new-time" type="number" placeholder="Time Limit (detik)" />
        <input id="new-expiry" type="date" />
        <select id="new-admin">
          <option value="false">User</option>
          <option value="true">Admin</option>
        </select>
        <button onclick="addUser()">Tambah</button>
      </div>
    </div>

    <!-- OWNER -->
    <div id="owner" class="hidden">
      <div class="card">
        <h3>Owner</h3>
        <p>Hubungi <b>Syafrial</b> melalui Telegram: @syafrialcontact</p>
      </div>
    </div>
  </main>

  <!-- SIGN UP -->
  <button id="signup-btn" onclick="signupPrompt()">Sign up</button>

  <script>
    const API_URL = "https://hospitable-bravery-production.up.railway.app/api";
    let currentUser = null;

    function showPage(id) {
      document.querySelectorAll('main > div').forEach(el => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function login() {
      const username = document.getElementById("login-username").value;
      const password = document.getElementById("login-password").value;

      fetch(API_URL + "/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) return alert(data.error);
        currentUser = data;
        document.getElementById("status").innerText = "Aktif";
        document.getElementById("expiry").innerText = data.expiry;

        document.getElementById("nav").classList.remove("hidden");
        if (data.isAdmin) {
          document.querySelectorAll(".admin-only").forEach(el => el.style.display = 'inline');
        }
        showPage('dashboard');
        loadHistory();
      });
    }

    function logout() {
      currentUser = null;
      showPage('login');
      document.getElementById("nav").classList.add("hidden");
      document.querySelectorAll(".admin-only").forEach(el => el.style.display = 'none');
    }

    function sendAttack() {
      const method = document.getElementById("method").value;
      const target = document.getElementById("target").value;
      const duration = parseInt(document.getElementById("duration").value);

      if (!currentUser) return alert("Not logged in");
      if (duration > currentUser.timeLimit) return alert("Melebihi time limit kamu");
      
      fetch(API_URL + "/history?username=" + currentUser.username)
        .then(res => res.json())
        .then(history => {
          const ongoing = history.length;
          if (ongoing >= currentUser.conc) return alert("Kamu sudah mencapai limit concurrent!");

          fetch(API_URL + "/history", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: currentUser.username,
              attack: { method, target, duration }
            })
          }).then(res => res.json())
            .then(data => {
              if (data.success) {
                alert("Attack sent!");
                loadHistory();
              } else {
                alert("Gagal mengirim attack");
              }
            });
        });
    }

    function loadHistory() {
      if (!currentUser) return;
      fetch(API_URL + "/history?username=" + currentUser.username)
        .then(res => res.json())
        .then(history => {
          const list = document.getElementById("history-list");
          list.innerHTML = "";
          history.forEach(h => {
            const li = document.createElement("li");
            li.innerText = `${h.time} - ${h.method} to ${h.target} (${h.duration}s)`;
            list.appendChild(li);
          });
        });
    }

    function addUser() {
      const newUser = {
        username: document.getElementById("new-username").value,
        password: document.getElementById("new-password").value,
        conc: parseInt(document.getElementById("new-conc").value),
        timeLimit: parseInt(document.getElementById("new-time").value),
        expiry: document.getElementById("new-expiry").value,
        isAdmin: document.getElementById("new-admin").value === "true",
        history: []
      };

      fetch(API_URL + "/add-user", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(newUser)
      }).then(res => res.json())
        .then(data => {
          if (data.success) alert("User berhasil ditambahkan!");
          else alert(data.error);
        });
    }

    function signupPrompt() {
      const username = prompt("Username:");
      const password = prompt("Password:");
      const captcha = prompt("Berapa 5 + 3?");

      if (captcha !== "8") return alert("Captcha salah");

      const user = {
        username,
        password,
        conc: 0,
        timeLimit: 0,
        expiry: new Date().toISOString().split('T')[0],
        isAdmin: false,
        history: []
      };

      fetch(API_URL + "/add-user", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(user)
      }).then(res => res.json())
        .then(data => {
          if (data.success) alert("Berhasil daftar, tunggu aktivasi admin.");
          else alert(data.error);
        });
    }

    // Start di login page
    showPage('login');
  </script>
</body>
</html>
