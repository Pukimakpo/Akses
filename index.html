<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syafrial's Stresser Panel</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e0e0e0;
      --primary: #6200ee;
      --danger: #d32f2f;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    input, select, button {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border: none;
      background: #333;
      color: white;
    }
    button {
      cursor: pointer;
      font-weight: bold;
    }
    .btn-primary {
      background: var(--primary);
    }
    .btn-danger {
      background: var(--danger);
    }
    .hidden {
      display: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Section -->
    <div id="login-section" class="card">
      <h1>Stresser Panel</h1>
      <input type="text" id="login-username" placeholder="Username">
      <input type="password" id="login-password" placeholder="Password">
      <button id="login-btn" class="btn-primary">Login</button>
      <p>own syafrial</p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <div class="card">
        <h2>Welcome, <span id="display-username"></span></h2>
        <button id="logout-btn" class="btn-danger">Logout</button>
      </div>

      <!-- Admin Panel -->
      <div id="admin-panel" class="card hidden">
        <h3>Admin Panel</h3>
        <input type="text" id="new-username" placeholder="New username">
        <input type="password" id="new-password" placeholder="New password">
        <input type="number" id="new-conc" placeholder="Concurrent limit">
        <input type="number" id="new-time" placeholder="Time limit (seconds)">
        <input type="number" id="new-days" placeholder="Days active">
        <button id="add-user-btn" class="btn-primary">Add User</button>
        
        <h4>User List</h4>
        <div id="user-list"></div>
      </div>

      <!-- Attack Panel -->
      <div class="card">
        <h3>Attack Panel</h3>
        <select id="attack-method">
          <option value="L4">Layer 4 (UDP/TCP)</option>
          <option value="L7">Layer 7 (HTTP)</option>
        </select>
        <input type="text" id="attack-target" placeholder="Target IP/URL">
        <input type="number" id="attack-duration" placeholder="Duration (seconds)">
        <button id="attack-btn" class="btn-primary">Launch Attack</button>
      </div>

      <!-- History -->
      <div class="card">
        <h3>Attack History</h3>
        <table id="history-table">
          <thead>
            <tr>
              <th>Target</th>
              <th>Method</th>
              <th>Duration</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // DOM Elements
    const loginSection = document.getElementById('login-section');
    const dashboard = document.getElementById('dashboard');
    const adminPanel = document.getElementById('admin-panel');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const attackBtn = document.getElementById('attack-btn');
    const addUserBtn = document.getElementById('add-user-btn');

    // State
    let currentUser = null;
    const API_URL = 'http://hospitable-bravery-production.up.railway.app/'; // Ganti dengan URL Railway/Vercel setelah deploy

    // Event Listeners
    loginBtn.addEventListener('click', handleLogin);
    logoutBtn.addEventListener('click', handleLogout);
    attackBtn.addEventListener('click', handleAttack);
    addUserBtn.addEventListener('click', handleAddUser);

    // Functions
    async function handleLogin() {
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (data.error) {
          alert(data.error);
          return;
        }

        currentUser = data;
        document.getElementById('display-username').textContent = data.username;
        loginSection.classList.add('hidden');
        dashboard.classList.remove('hidden');

        if (data.isAdmin) {
          adminPanel.classList.remove('hidden');
          loadUsers();
        }
        loadHistory();
      } catch (error) {
        alert('Connection error');
      }
    }

    function handleLogout() {
      currentUser = null;
      dashboard.classList.add('hidden');
      loginSection.classList.remove('hidden');
    }

    async function handleAttack() {
      const target = document.getElementById('attack-target').value;
      const method = document.getElementById('attack-method').value;
      const duration = parseInt(document.getElementById('attack-duration').value);

      if (!target || !duration) {
        alert('Please fill all fields');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/attack`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: currentUser.username,
            target,
            method,
            duration
          })
        });
        const data = await response.json();

        if (data.error) {
          alert(data.error);
          return;
        }

        alert('Attack launched successfully!');
        loadHistory();
      } catch (error) {
        alert('Failed to launch attack');
      }
    }

    async function handleAddUser() {
      const username = document.getElementById('new-username').value;
      const password = document.getElementById('new-password').value;
      const conc = parseInt(document.getElementById('new-conc').value);
      const timeLimit = parseInt(document.getElementById('new-time').value);
      const daysActive = parseInt(document.getElementById('new-days').value);

      if (!username || !password) {
        alert('Username and password required');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/add-user`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            adminUsername: currentUser.username,
            username,
            password,
            conc,
            timeLimit,
            daysActive
          })
        });
        const data = await response.json();

        if (data.error) {
          alert(data.error);
          return;
        }

        alert('User added successfully!');
        loadUsers();
      } catch (error) {
        alert('Failed to add user');
      }
    }

    async function loadUsers() {
      try {
        const response = await fetch(`${API_URL}/users?username=${currentUser.username}`);
        const users = await response.json();

        const userList = document.getElementById('user-list');
        userList.innerHTML = users.map(user => `
          <div style="margin: 10px 0; padding: 10px; background: #333; border-radius: 4px;">
            <p>Username: ${user.username}</p>
            <p>Concurrent: ${user.conc}</p>
            <p>Time Limit: ${user.timeLimit}s</p>
            <p>Expiry: ${new Date(user.expiry).toLocaleDateString()}</p>
            ${user.username !== 'admin' ? `<button onclick="deleteUser('${user.username}')" class="btn-danger">Delete</button>` : ''}
          </div>
        `).join('');
      } catch (error) {
        console.error('Failed to load users');
      }
    }

    async function deleteUser(username) {
      if (!confirm(`Delete user ${username}?`)) return;

      try {
        const response = await fetch(`${API_URL}/delete-user`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            adminUsername: currentUser.username,
            targetUsername: username
          })
        });
        const data = await response.json();

        if (data.error) {
          alert(data.error);
          return;
        }

        alert('User deleted');
        loadUsers();
      } catch (error) {
        alert('Failed to delete user');
      }
    }

    async function loadHistory() {
      try {
        const response = await fetch(`${API_URL}/users?username=${currentUser.username}`);
        const users = await response.json();
        const user = users.find(u => u.username === currentUser.username);

        const historyTable = document.querySelector('#history-table tbody');
        historyTable.innerHTML = user.history.map(attack => `
          <tr>
            <td>${attack.target}</td>
            <td>${attack.method}</td>
            <td>${attack.duration}s</td>
            <td>${new Date(attack.timestamp).toLocaleString()}</td>
          </tr>
        `).join('');
      } catch (error) {
        console.error('Failed to load history');
      }
    }

    // Expose to global scope
    window.deleteUser = deleteUser;
  </script>
</body>
</html>
